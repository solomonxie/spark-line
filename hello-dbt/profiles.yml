# Connection profile — defines *how* to connect (adapter, credentials).
# Kept separate from dbt_project.yml by dbt's design; dbt looks it up by
# the `profile:` name declared in dbt_project.yml.
#
# Project-local file — no ~/.dbt/profiles.yml needed. Point dbt at it
# with `--profiles-dir .` or `export DBT_PROFILES_DIR=$(pwd)`.
#
# Needs nothing but `pip install dbt-duckdb` (see Makefile).

hello_dbt:              # profile name, must match `profile:` in dbt_project.yml
  target: duckdb        # which output below is used by default
  outputs:
    duckdb:              # target name, referenced by `target:` above
      type: duckdb
      path: hello_dbt.duckdb   # local DuckDB file, created on first run
      threads: 4                # max parallel model runs
