# Worker N (1..spark_worker_count) gets webui port spark_worker_webui_base_port + N
# (8081, 8082, ...) — that port number also names the systemd instance
# (spark-worker@8081, spark-worker@8082, ...), see templates/spark-worker@.service.j2.
- name: Create per-worker work directories
  ansible.builtin.file:
    path: "{{ spark_home }}/work/worker-{{ spark_worker_webui_base_port + item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop: "{{ range(1, spark_worker_count + 1) | list }}"

- name: Deploy Spark master systemd unit
  become: true
  ansible.builtin.template:
    src: spark-master.service.j2
    dest: /etc/systemd/system/spark-master.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy Spark worker systemd template unit
  become: true
  ansible.builtin.template:
    src: spark-worker@.service.j2
    dest: /etc/systemd/system/spark-worker@.service
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the units are registered before (re)starting
  ansible.builtin.meta: flush_handlers

- name: Enable and start Spark master
  become: true
  ansible.builtin.systemd:
    name: spark-master.service
    enabled: true
    state: restarted

- name: Wait for Spark master to accept connections
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address }}"
    port: "{{ spark_master_port }}"
    timeout: 30

- name: Enable and start Spark workers
  become: true
  ansible.builtin.systemd:
    name: "spark-worker@{{ spark_worker_webui_base_port + item }}.service"
    enabled: true
    state: restarted
  loop: "{{ range(1, spark_worker_count + 1) | list }}"
