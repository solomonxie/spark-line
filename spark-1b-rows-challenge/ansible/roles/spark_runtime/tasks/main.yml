- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - openjdk-17-jdk-headless
      - wget
      - curl
      - tar
      - python3-pip
      - python3-venv
    state: present

- name: Install pyspark
  ansible.builtin.pip:
    name: pyspark
    extra_args: "--quiet --break-system-packages --use-pep517"

- name: Install pandas
  ansible.builtin.pip:
    name: pandas
    extra_args: "--quiet --break-system-packages"

# ansible.builtin.get_url appeared to hang partway through this download;
# turned out to be an artifact of watching a stale temp file from an
# earlier attempt, not an actual stall — curl here confirmed real (if
# modest, ~350-600 KB/s from this region) steady progress throughout.
# --max-time is generous headroom over the ~25 min this download actually
# takes at that rate, not evidence it needs to be — err high, not low.
- name: Download Spark archive
  ansible.builtin.command: >
    curl --fail --location --silent --show-error --connect-timeout 15 --max-time 2400
    --output /tmp/{{ spark_archive }} {{ spark_download_url }}
  args:
    creates: "/tmp/{{ spark_archive }}"

- name: Check if Spark is already extracted
  ansible.builtin.stat:
    path: "{{ spark_home }}/bin/spark-submit"
  register: spark_installed

- name: Extract Spark archive
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/{{ spark_archive }}"
    dest: /opt
    remote_src: true
  when: not spark_installed.stat.exists

- name: Rename extracted Spark dir to /opt/spark
  become: true
  ansible.builtin.command: "mv /opt/spark-{{ spark_version }}-bin-{{ hadoop_version }} {{ spark_home }}"
  when: not spark_installed.stat.exists

- name: Remove downloaded archive
  ansible.builtin.file:
    path: "/tmp/{{ spark_archive }}"
    state: absent

- name: Own /opt/spark by ubuntu
  become: true
  ansible.builtin.file:
    path: "{{ spark_home }}"
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Set Spark environment variables
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/spark.sh
    content: |
      export SPARK_HOME={{ spark_home }}
      export PATH=$PATH:$SPARK_HOME/bin:$SPARK_HOME/sbin
      export PYSPARK_PYTHON=python3
    mode: "0644"
