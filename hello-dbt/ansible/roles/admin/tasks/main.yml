- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install Postgres
  become: true
  ansible.builtin.apt:
    name:
      - postgresql
    state: present

- name: Ensure Postgres is running
  become: true
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Detect the installed Postgres major version
  become: true
  ansible.builtin.command: ls /etc/postgresql
  register: pg_installed_versions
  changed_when: false

- name: Set postgres_conf_dir fact
  ansible.builtin.set_fact:
    postgres_conf_dir: "/etc/postgresql/{{ pg_installed_versions.stdout_lines[0] }}/main"

- name: Check if the dbt role exists
  become: true
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='dbt'"
  register: dbt_role_check
  changed_when: false

- name: Create the dbt role
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -c "CREATE ROLE dbt WITH LOGIN CREATEDB PASSWORD '{{ postgres_password }}'"
  when: dbt_role_check.stdout != "1"

- name: Check if the hello_dbt database exists
  become: true
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='hello_dbt'"
  register: dbt_db_check
  changed_when: false

- name: Create the hello_dbt database
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c "CREATE DATABASE hello_dbt OWNER dbt"
  when: dbt_db_check.stdout != "1"

- name: Listen on all interfaces (dbt connects from outside the node)
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgres_conf_dir }}/postgresql.conf"
    regexp: "^#?\\s*listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart postgresql

- name: Allow password auth from any host (sandbox — SG already restricts by port)
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgres_conf_dir }}/pg_hba.conf"
    line: "host    all             all             0.0.0.0/0               scram-sha-256"
  notify: Restart postgresql

- name: Flush handlers so config changes take effect before the play ends
  ansible.builtin.meta: flush_handlers
